<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Séance · MEHDI 2.0</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/common.css">
<style>
.live{display:inline-flex;align-items:center;gap:6px;background:#e3eefa;border-radius:999px;padding:4px 10px;font-size:13px;color:#1d6cb3;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#1d6cb3;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
#topx{display:flex;gap:6px}
@media (max-width:560px){.live{display:none}}
main{max-width:1180px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr 330px;gap:14px}
@media (max-width:860px){main{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;cursor:pointer}
.tabs button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.tabs #newc{flex:none;padding:10px 12px}
main>section.card{display:flex;flex-direction:column}
#chatw{flex:1;min-height:min(56vh,520px);position:relative}
#chat{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--ac)}
.send{display:flex;gap:8px}
.send input{flex:1;min-width:0;padding:11px 12px;border-radius:12px}
.send button{border:0;border-radius:12px;padding:0 16px;cursor:pointer}
#go{background:var(--ac);color:#fff;font-weight:600}
#mic{background:var(--bg);border:1px solid var(--bd)}
#mic.rec{background:var(--contre);color:#fff}
.send button:disabled{opacity:.5}
aside{display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:11px;color:var(--mut)}
.btns{display:flex;gap:6px}
.btns button{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:7px;cursor:pointer;font-size:14px}
.wide{width:100%}
#sum{white-space:pre-wrap;font-size:14px;margin-top:10px;display:none;background:var(--bg);border-radius:10px;padding:10px}
/* débat : sondage + chrono (prof) */
#poll{display:none}
body.debat.isprof #poll{display:block}
body.debat aside .card:not(#poll):not(#lessoncard){display:none}
.timer{font-size:38px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{color:var(--contre)}
.turn{text-align:center;font-size:14px;color:var(--mut);margin-bottom:8px}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.vb{border:2px solid var(--bd);border-radius:12px;padding:10px;font-weight:700;cursor:pointer;color:#fff}
.vb.pour{background:var(--pour);border-color:var(--pour)}
.vb.contre{background:var(--contre);border-color:var(--contre)}
.vb:active{transform:scale(.97)}
.bar{display:flex;height:22px;border-radius:999px;overflow:hidden;background:var(--bd)}
.bar i{display:block;height:100%;transition:width .4s}
#bp{background:var(--pour)}#bc{background:var(--contre)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;margin-top:10px}
.res div{background:var(--bg);border-radius:12px;padding:8px}
.res b{display:block;font-size:28px;line-height:1.1}
.res span{font-size:12px;color:var(--mut)}
.res .p b{color:var(--pour)}.res .c b{color:var(--contre)}
#lead{margin:10px 0 6px;text-align:center;font-weight:700;background:var(--ac2);color:var(--ac);border-radius:10px;padding:8px}
#dur{flex:1;width:auto}
/* projection */
body.proj .bub{font-size:22px}
body.proj #chatw{min-height:62vh}
body.proj main{grid-template-columns:1fr 360px}
body.proj aside .card:not(#poll):not(#lessoncard){display:none}
body.proj .timer{font-size:72px}
body.proj .vb{font-size:22px;padding:16px}
body.proj .res b{font-size:44px}
@media (max-width:860px){body.proj main{grid-template-columns:1fr}}
/* modale liens web */
#urlModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;align-items:center;justify-content:center}
#urlModal.open{display:flex}
#urlBox{width:min(500px,94vw);display:flex;flex-direction:column;gap:6px}
#urlBox textarea{min-height:110px}
</style>
</head>
<body>
<header id="top"></header>

<main>
<section class="card">
  <div class="tabs" id="tabs">
    <button data-m="cours" class="on">💬 Questions</button>
    <button data-m="debat">⚖️ Débat</button>
    <button data-m="quiz">📝 Quiz</button>
    <button id="newc" title="Ranger cette conversation dans l'historique et en commencer une nouvelle">🆕</button>
  </div>
  <div id="chatw"><div id="chat" aria-live="polite"></div></div>
  <div class="chips" id="chips"></div>
  <div class="send">
    <button id="mic" title="Dicter" style="display:none">🎤</button>
    <input id="msg" placeholder="Écris ta question ou ton argument…" autocomplete="off" maxlength="2000">
    <button id="go">Envoyer</button>
  </div>
</section>

<aside>
  <div class="card" id="poll">
    <h3>Débat &amp; Sondage</h3>
    <input id="pq" placeholder="Question du sondage (facultatif)">
    <div class="vote">
      <button class="vb pour" data-v="p">👍 POUR</button>
      <button class="vb contre" data-v="c">👎 CONTRE</button>
    </div>
    <div class="bar"><i id="bp" style="width:0"></i><i id="bc" style="width:0"></i></div>
    <div class="res">
      <div class="p"><b id="pp">0 %</b><span id="pn">POUR · 0 vote</span></div>
      <div class="c"><b id="pc">0 %</b><span id="cn">CONTRE · 0 vote</span></div>
    </div>
    <div id="lead">Aucun vote pour l'instant</div>
    <button class="btn sec wide" id="rz">↺ Remettre le sondage à zéro</button>
    <hr style="border:none;border-top:1px solid var(--bd);margin:16px 0 12px">
    <div class="turn" id="turn">Temps de parole</div>
    <div class="timer" id="tm">02:00</div>
    <div class="btns" style="margin-top:8px">
      <select id="dur" title="Durée de parole"><option value="60">1 min</option><option value="120" selected>2 min</option><option value="180">3 min</option></select>
      <button id="t1">▶ Start</button><button id="t2">↺ Reset</button>
    </div>
  </div>

  <div class="card" id="lessoncard">
    <h3>Cours de la séance</h3>
    <label for="lesson">Leçon</label>
    <select id="lesson"><option value="">— Aucune leçon (général) —</option></select>
    <div id="profLesson" hidden>
      <label for="newcls">Classe des nouvelles leçons</label>
      <select id="newcls"><option value="">Toutes les classes</option></select>
      <div class="btns" style="margin-top:8px">
        <button id="upb" type="button">📎 PDF / PPTX</button>
        <button id="urlb" type="button">🔗 Liens web</button>
        <button id="delb" type="button" title="Supprimer la leçon">🗑️</button>
      </div>
      <input type="file" id="up" accept=".pdf,.pptx,.txt,.md" hidden>
      <label for="extra">Notes du jour pour cette leçon (l'IA en tient compte)</label>
      <textarea id="extra" rows="3" placeholder="Ex : insister sur la prévention. Niveau : 1re année collège."></textarea>
    </div>
    <div id="lmsg" class="hint"></div>
  </div>

  <div class="card">
    <h3>Conversation</h3>
    <div class="stats">
      <div><b id="s1">0</b><span>messages</span></div>
      <div><b id="s2">0</b><span>questions</span></div>
      <div><b id="s3">0</b><span>min</span></div>
    </div>
  </div>

  <div class="card" id="aide" hidden>
    <h3>Aide au prof</h3>
    <button class="btn wide" id="sumb">✨ Résumé de la séance</button>
    <div id="sum"></div>
  </div>
</aside>
</main>

<div id="urlModal" role="dialog" aria-modal="true" aria-labelledby="urlTitle">
  <div id="urlBox" class="card">
    <h2 id="urlTitle">🔗 Importer depuis des liens web</h2>
    <label for="urlName">Nom de la leçon</label>
    <input id="urlName" placeholder="Ex : Les séismes – Wikipédia" maxlength="80">
    <label for="urlList">Liens (1 par ligne, 5 maximum)</label>
    <textarea id="urlList" placeholder="https://fr.wikipedia.org/wiki/Séisme"></textarea>
    <div id="urlMsg" class="hint"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn sec" id="urlCancel">Annuler</button>
      <button class="btn" id="urlSubmit">Importer</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
const { $, api } = MEHDI;
const MODES = {
  cours: { hello: "Bonjour ! Je suis l’assistant de la séance. Pose-moi une question sur le cours : je t’aide à réfléchir plutôt que de te donner la réponse toute faite.",
    chips: ["Explique-moi le sujet simplement", "Donne-moi un exemple concret", "Je ne comprends pas, aide-moi"] },
  debat: { hello: "Bienvenue dans le débat ! Je te propose une question tirée du cours, puis tu choisis ton camp.",
    chips: ["Je suis POUR", "Je suis CONTRE", "Donne-moi un autre argument", "Fais la synthèse du débat"] },
  quiz: { hello: "C’est l’heure du quiz ! Écris « Commencer » et je te pose une première question sur le cours.",
    chips: ["Commencer", "Question suivante", "Plus difficile", "Mon score ?"] }
};
const chat = $("chat");
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let me, isProf = false, mode = "cours", conv = null, busy = false, live = null, lessons = [];
const myRole = () => isProf ? "prof" : "eleve";
const lessonId = () => $("lesson").value;

/* ---------- Affichage de la conversation ---------- */
function render() {
  chat.innerHTML = "";
  let hello = MODES[mode].hello;
  if (mode === "debat" && !lessonId()) hello = "Choisis une leçon à droite : le débat commencera tout de suite sur ce cours.";
  MEHDI.bubble(chat, "bot", hello);
  for (const m of conv?.messages || []) MEHDI.bubble(chat, m.role === "user" ? (conv.role === "prof" ? "prof" : "eleve") : "bot", m.text, MEHDI.fmtTime(m.t));
  live = null;
  if (conv?.pending) { live = MEHDI.bubble(chat, "bot", null); if (conv.partial) live.textContent = conv.partial; }
  chat.scrollTop = chat.scrollHeight;
  stats();
}
function showLive(txt) {
  if (!live) return;
  const bas = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
  live.textContent = txt;
  if (bas) chat.scrollTop = chat.scrollHeight;
}
function stats() {
  const msgs = conv?.messages || [];
  $("s1").textContent = msgs.length;
  $("s2").textContent = msgs.filter(m => m.role === "user").length;
  $("s3").textContent = conv ? Math.max(0, Math.floor((Date.now() - new Date(conv.created)) / 60000)) : 0;
}
function setBusy(b) { busy = b; $("go").disabled = b; }

/* ---------- Chargement depuis le serveur ---------- */
async function loadConv({ kickoff = true } = {}) {
  const m = mode;
  const d = await api("/api/conv?mode=" + m);
  if (m !== mode) return;
  conv = d.conv;
  render();
  if (conv?.pending) return pollConv(m);
  if (kickoff) maybeKickoff();
}
/* Une réponse s'écrit encore (page rechargée, autre fenêtre…) : on la suit */
async function pollConv(m) {
  setBusy(true);
  for (let i = 0; i < 200 && m === mode; i++) {
    await new Promise(r => setTimeout(r, 700));
    const d = await api("/api/conv?mode=" + m).catch(() => null);
    if (!d || m !== mode) continue;
    if (!d.conv?.pending) { conv = d.conv; render(); break; }
    showLive(d.conv.partial || "");
  }
  setBusy(false);
}
/* Débat : l'IA lance tout de suite une question sur le cours choisi */
function maybeKickoff() {
  if (mode === "debat" && lessonId() && !busy && !(conv && conv.messages.length)) send("", { kickoff: true });
}

/* ---------- Envoi d'un message (réponse affichée au fur et à mesure) ---------- */
async function send(text, { kickoff = false } = {}) {
  text = (text ?? $("msg").value).trim();
  if (busy || (!kickoff && !text)) return;
  const m = mode;
  setBusy(true);
  if (!kickoff) { $("msg").value = ""; MEHDI.bubble(chat, myRole(), text, MEHDI.fmtTime(new Date())); }
  live = MEHDI.bubble(chat, "bot", null);
  chat.scrollTop = chat.scrollHeight;
  let acc = "", erreur = null;
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: m, text, kickoff, lessonId: lessonId() }) });
    if (r.status === 401) { location.href = "/login.html"; return; }
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || "Erreur"); }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = "", fini = false;
    while (!fini) {
      const { value, done } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        let o; try { o = JSON.parse(line); } catch { continue; }
        if (o.d) { acc += o.d; if (m === mode) showLive(acc); }
        if (o.error) { erreur = o.error; if (o.text && !$("msg").value) $("msg").value = o.text; }
        if (o.done || o.error || o.skipped) fini = true;
      }
    }
    if (!fini) throw new TypeError("coupé");
  } catch (e) {
    if (e instanceof TypeError) { setBusy(false); if (m === mode) await loadConv({ kickoff: false }); return; }  // le serveur continue : on reprend
    erreur = e.message;
  }
  setBusy(false);
  if (m !== mode) return;
  await loadConv({ kickoff: false }).catch(() => {});
  if (erreur) MEHDI.bubble(chat, "bot", "⚠️ " + erreur);
  chat.scrollTop = chat.scrollHeight;
}

/* ---------- Onglets ---------- */
function setMode(m) {
  mode = m; store.set("mehdi-mode", m);
  document.querySelectorAll("#tabs button[data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  document.body.classList.toggle("debat", m === "debat");
  const c = $("chips"); c.innerHTML = "";
  MODES[m].chips.forEach(t => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => send(t); c.appendChild(b); });
  conv = null; render();
  loadConv().catch(e => MEHDI.bubble(chat, "bot", "⚠️ " + e.message));
}
document.querySelectorAll("#tabs button[data-m]").forEach(b => b.onclick = () => { if (b.dataset.m !== mode) setMode(b.dataset.m); });
$("newc").onclick = async () => {
  if (busy) return alert("Attends la fin de la réponse de l’IA.");
  if (conv?.messages.length && !confirm("Ranger cette conversation dans l’historique et en commencer une nouvelle ?")) return;
  try { await api("/api/conv/new", { method: "POST", body: { mode } }); await loadConv(); } catch (e) { alert(e.message); }
};

/* ---------- Leçons ---------- */
async function loadLessons(sel) {
  const d = await api("/api/lessons");
  lessons = d.lessons;
  const s = $("lesson");
  const keep = sel ?? s.value ?? store.get("mehdi-lesson");
  s.innerHTML = '<option value="">— Aucune leçon (général) —</option>';
  for (const l of lessons) {
    const o = document.createElement("option"); o.value = l.id;
    o.textContent = l.name + (isProf ? " · " + (l.className || "toutes les classes") : "");
    s.appendChild(o);
  }
  s.value = lessons.some(l => l.id === keep) ? keep : "";
  if (!lessons.length) $("lmsg").textContent = isProf ? "Aucune leçon importée pour l’instant." : "Le professeur n’a pas encore ajouté de leçon pour ta classe.";
  else $("lmsg").textContent = "";
  lessonChanged(false);
}
function lessonChanged(user = true) {
  store.set("mehdi-lesson", lessonId());
  const l = lessons.find(x => x.id === lessonId());
  if (isProf) { $("extra").value = l?.notes || ""; $("extra").disabled = !l; $("delb").disabled = !l; }
  if (user && mode === "debat") { render(); maybeKickoff(); }
}
$("lesson").onchange = () => lessonChanged(true);

/* Notes du jour : enregistrées sur la leçon, quelques instants après la frappe */
let tNotes = null;
$("extra").addEventListener("input", () => {
  clearTimeout(tNotes);
  const id = lessonId(), notes = $("extra").value;
  tNotes = setTimeout(async () => {
    try { await api("/api/lessons", { method: "PUT", body: { id, notes } });
      const l = lessons.find(x => x.id === id); if (l) l.notes = notes;
      $("lmsg").textContent = "Notes enregistrées."; } catch (e) { $("lmsg").textContent = e.message; }
  }, 800);
});

$("upb").onclick = () => $("up").click();
$("up").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("lmsg").textContent = "Import en cours…";
  try {
    const d = await api("/api/lessons?name=" + encodeURIComponent(f.name) + "&filename=" + encodeURIComponent(f.name) + "&classId=" + encodeURIComponent($("newcls").value),
      { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: f });
    await loadLessons(d.id);
    $("lmsg").textContent = "Leçon ajoutée (" + d.chars + " caractères)." + (d.tronque ? " Texte coupé à 60 000 caractères." : "");
    lessonChanged(true);
  } catch (err) { $("lmsg").textContent = err instanceof TypeError ? "Le serveur ne répond pas." : err.message; }
  e.target.value = "";
};
$("delb").onclick = async () => {
  const l = lessons.find(x => x.id === lessonId()); if (!l) return;
  if (!confirm("Supprimer la leçon « " + l.name + " » et son résumé ?")) return;
  try { await api("/api/lessons?id=" + encodeURIComponent(l.id), { method: "DELETE" }); await loadLessons(""); $("lmsg").textContent = "Leçon supprimée."; }
  catch (e) { $("lmsg").textContent = e.message; }
};
$("urlb").onclick = () => { $("urlModal").classList.add("open"); $("urlName").focus(); };
const closeUrl = () => { $("urlModal").classList.remove("open"); $("urlMsg").textContent = ""; };
$("urlCancel").onclick = closeUrl;
$("urlModal").addEventListener("click", e => { if (e.target === $("urlModal")) closeUrl(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeUrl(); });
$("urlSubmit").onclick = async () => {
  const name = $("urlName").value.trim() || "Ressources web";
  const urls = $("urlList").value.split("\n").map(l => l.trim()).filter(l => l.startsWith("http"));
  if (!urls.length) return ($("urlMsg").textContent = "Colle au moins un lien valide (http…).");
  if (urls.length > 5) return ($("urlMsg").textContent = "Maximum 5 liens à la fois.");
  $("urlSubmit").disabled = true; $("urlMsg").textContent = "Récupération en cours…";
  try {
    const d = await api("/api/fetch-url", { method: "POST", body: { urls, name, classId: $("newcls").value } });
    await loadLessons(d.id);
    $("lmsg").textContent = "Leçon ajoutée depuis " + urls.length + " lien(s) (" + d.chars + " caractères)." + (d.warnings?.length ? " ⚠️ " + d.warnings.length + " lien(s) ignoré(s)." : "");
    closeUrl(); $("urlName").value = ""; $("urlList").value = "";
    lessonChanged(true);
  } catch (e) { $("urlMsg").textContent = e.message; }
  $("urlSubmit").disabled = false;
};

/* ---------- Résumé de la séance (prof) ---------- */
$("sumb").onclick = async () => {
  const box = $("sum"); box.style.display = "block";
  const pt = pollText();
  const msgs = conv?.messages || [];
  if (msgs.length < 2) { box.textContent = (pt ? pt + "\n\n" : "") + "Pas encore assez d’échanges pour faire un résumé."; return; }
  box.textContent = "Analyse en cours…";
  const tr = msgs.map(h => (h.role === "user" ? "Élève : " : "Assistant : ") + h.text).join("\n");
  const l = lessons.find(x => x.id === lessonId());
  try {
    const d = await api("/api/ask", { method: "POST", body: { prompt: "Cours : " + (l?.name || "général") + ". Voici les échanges de la séance (mode " + mode + ") :\n" + tr + (pt ? "\n" + pt : "") +
      "\n\nFais un résumé pour le prof, en 4 parties courtes : 1) Points abordés 2) Arguments POUR/OUI et CONTRE/NON 3) Difficultés ou incompréhensions repérées 4) Suggestion pour la suite du cours." } });
    box.textContent = (pt ? "📊 " + pt + "\n\n" : "") + d.reply;
  } catch (e) { box.textContent = (pt ? pt + "\n\n" : "") + "Impossible de générer le résumé : " + e.message; }
};

/* ---------- Sondage POUR / CONTRE ---------- */
let votes = { p: 0, c: 0 };
try { const s = JSON.parse(store.get("sondage") || "null"); if (s) votes = { p: +s.p || 0, c: +s.c || 0 }; } catch {}
const pct = n => { const t = votes.p + votes.c; return t ? Math.round(n * 100 / t) : 0; };
const nv = n => n + (n > 1 ? " votes" : " vote");
function pollText() {
  const t = votes.p + votes.c; if (!t) return "";
  const q = $("pq").value.trim();
  const lead = votes.p === votes.c ? "Égalité parfaite" : "Majorité : " + (votes.p > votes.c ? "POUR" : "CONTRE") + " avec " + pct(Math.max(votes.p, votes.c)) + " %";
  return "Sondage" + (q ? " « " + q + " »" : "") + " : " + pct(votes.p) + " % POUR (" + nv(votes.p) + ") et " + pct(votes.c) + " % CONTRE (" + nv(votes.c) + "), sur " + t + " votants. " + lead + ".";
}
function renderPoll() {
  const t = votes.p + votes.c, p = pct(votes.p), c = t ? 100 - p : 0;
  $("bp").style.width = p + "%"; $("bc").style.width = c + "%";
  $("pp").textContent = p + " %"; $("pc").textContent = c + " %";
  $("pn").textContent = "POUR · " + nv(votes.p); $("cn").textContent = "CONTRE · " + nv(votes.c);
  $("lead").textContent = !t ? "Aucun vote pour l'instant" : votes.p === votes.c ? "⚖️ Égalité : " + p + " % – " + c + " %" : "🏆 Majorité : " + (votes.p > votes.c ? "POUR" : "CONTRE") + " (" + Math.max(p, c) + " %)";
  store.set("sondage", JSON.stringify(votes));
}
document.querySelectorAll(".vb").forEach(b => b.onclick = () => { votes[b.dataset.v]++; renderPoll(); });
$("rz").onclick = () => { if (votes.p + votes.c && !confirm("Remettre le sondage à zéro ?")) return; votes = { p: 0, c: 0 }; renderPoll(); };
$("pq").value = store.get("mehdi-pq") || "";
$("pq").oninput = () => store.set("mehdi-pq", $("pq").value);

/* ---------- Chrono ---------- */
let dur = 120, left = 120, iv = null;
const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
function tick() { $("tm").textContent = fmt(left); $("tm").classList.toggle("low", left <= 15); }
function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 660; o.start(); setTimeout(() => { o.stop(); c.close(); }, 400); } catch {} }
function stopT() { clearInterval(iv); iv = null; $("t1").textContent = "▶ Start"; }
function startT() {
  if (left <= 0) left = dur;
  clearInterval(iv); $("t1").textContent = "⏸ Pause";
  iv = setInterval(() => { left--; tick(); if (left <= 0) { stopT(); beep(); $("turn").textContent = "⏰ Temps écoulé !"; } }, 1000);
}
$("t1").onclick = () => iv ? stopT() : startT();
$("t2").onclick = () => { stopT(); left = dur; tick(); $("turn").textContent = "Temps de parole"; };
$("dur").onchange = () => { dur = +$("dur").value; stopT(); left = dur; tick(); $("turn").textContent = "Temps de parole"; };

/* ---------- Divers ---------- */
$("go").onclick = () => send();
$("msg").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  $("mic").style.display = "block";
  $("mic").onclick = () => { try {
    const r = new SR(); r.lang = "fr-FR"; $("mic").classList.add("rec");
    r.onresult = e => { $("msg").value = e.results[0][0].transcript; };
    r.onend = () => $("mic").classList.remove("rec"); r.onerror = () => $("mic").classList.remove("rec"); r.start();
  } catch { $("mic").style.display = "none"; } };
}
setInterval(stats, 30000);
// Quand on revient sur la page, on resynchronise (une réponse a pu arriver entre-temps)
document.addEventListener("visibilitychange", () => { if (!document.hidden && !busy) loadConv({ kickoff: false }).catch(() => {}); });

/* ---------- Démarrage ---------- */
(async () => {
  me = await MEHDI.init("seance");
  isProf = me.role === "prof";
  document.body.classList.toggle("isprof", isProf);
  $("profLesson").hidden = !isProf;
  $("aide").hidden = !isProf;
  $("msg").placeholder = isProf ? "Écris un message (projeté au tableau)…" : "Écris ta question ou ton argument…";
  // Boutons en haut : séance en cours + projection (prof)
  const live = document.createElement("span"); live.className = "live"; live.innerHTML = '<i class="dot"></i>Séance en cours';
  $("topx").appendChild(live);
  if (isProf) {
    const pb = document.createElement("button"); pb.className = "hb"; pb.textContent = "📽️ Projection";
    pb.onclick = () => { const on = document.body.classList.toggle("proj"); pb.textContent = on ? "↩ Quitter la projection" : "📽️ Projection"; };
    $("topx").appendChild(pb);
    const cl = await api("/api/classes").catch(() => ({ classes: [] }));
    for (const c of cl.classes) { const o = document.createElement("option"); o.value = c.id; o.textContent = c.name; $("newcls").appendChild(o); }
    $("newcls").value = store.get("mehdi-newcls") || "";
    $("newcls").onchange = () => store.set("mehdi-newcls", $("newcls").value);
  }
  tick(); renderPoll();
  await loadLessons(store.get("mehdi-lesson") || "").catch(e => $("lmsg").textContent = e.message);
  const m0 = store.get("mehdi-mode");
  setMode(MODES[m0] ? m0 : "cours");
})();
</script>
</body>
</html>
